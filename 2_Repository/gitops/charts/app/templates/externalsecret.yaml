{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  labels: {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: {{ .Values.secretStore.name }}, kind: {{ .Values.secretStore.kind }}}
  target: {name: app-secrets}
  data:
    - {secretKey: pg_user,        remoteRef: {key: {{ .Values.secretNames.postgres | quote }}, property: username}}
    - {secretKey: pg_password,    remoteRef: {key: {{ .Values.secretNames.postgres | quote }}, property: password}}
    - {secretKey: pg_host_direct, remoteRef: {key: {{ .Values.secretNames.postgres | quote }}, property: host}}
    - {secretKey: redis_addr,     remoteRef: {key: {{ .Values.secretNames.redis | quote }}, property: address}}
    - {secretKey: redis_host,     remoteRef: {key: {{ .Values.secretNames.redis | quote }}, property: host}}
    - {secretKey: redis_password, remoteRef: {key: {{ .Values.secretNames.redis | quote }}, property: password}}
{{- end }}
