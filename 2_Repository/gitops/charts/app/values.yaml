# Image is injected by gitops/rings/<ring>/image.yaml (digest only; tags are never deployed).
image:
  repository: ghcr.io/immverse/app
  digest: ""

tenant: shared
sloTarget: 99.9          # 99.9 shared, 99.95 dedicated (tenant values.yaml overrides)
sloErrorBudget: 0.001    # = 1 - sloTarget/100 ; 0.0005 for dedicated (kept explicit: no float math in Helm)
redisTLS: "true"          # false on kind
prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
secretStore: {name: platform-secrets, kind: ClusterSecretStore}
secretNames: {postgres: "", redis: ""}   # secrets-manager key names, set per cluster
externalSecrets: {enabled: true}          # false on kind: scripts/local.sh creates the app-secrets Secret

# ASSUMPTIONS about the black-box image (verify; see docs/ARCHITECTURE.md risks R1-R3)
api:
  command: ["/app/api"]
  port: 8080
  resources: {requests: {cpu: "1", memory: 1Gi}, limits: {memory: 1Gi}}
  terminationGracePeriodSeconds: 45
  preStopSleepSeconds: 10          # let endpoints/ingress deregister before SIGTERM
  autoscaling: {min: 6, max: 68, targetRpsPerPod: 40, targetCpuUtilization: 70}
  canary:
    steps: [5, 25, 50, 100]
    pauseSeconds: 300
  gates: {maxErrorRatio: 0.005, maxP95Seconds: 0.4}
  db: {pool: 10}
worker:
  command: ["/app/worker"]
  resources: {requests: {cpu: 500m, memory: 512Mi}, limits: {memory: 512Mi}}
  terminationGracePeriodSeconds: 90   # > 60 s max job
  slotsPerPod: 4
  autoscaling: {min: 3, max: 90, queueKey: jobs, listLengthPerPod: 8, pollingInterval: 10, cooldownPeriod: 300}
  db: {pool: 2}
migration:
  enabled: true
  command: ["/app/api", "--migrate-only"]   # ASSUMPTION A1: if absent, see runbook db-migration-failure.md
  advisoryLockId: 727274
pgbouncer:
  enabled: true
  image: edoburu/pgbouncer:1.23.1
  replicas: 3
  poolMode: transaction
  defaultPoolSize: 50
  maxClientConn: 2000
overprovision: {enabled: false}     # AWS clusters enable it in gitops/platform/karpenter
host: app.example.com
