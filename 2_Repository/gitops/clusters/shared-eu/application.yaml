apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-shared
  namespace: argocd
  labels: {ring: shared-prod}
spec:
  project: default
  source:
    repoURL: https://github.com/immverse/devops-platform.git
    targetRevision: main
    path: gitops/charts/app
    helm:
      valueFiles:
        - ../../rings/shared-prod/image.yaml
        - ../../clusters/shared-eu/values.yaml
  destination: {server: https://kubernetes.default.svc, namespace: app}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
