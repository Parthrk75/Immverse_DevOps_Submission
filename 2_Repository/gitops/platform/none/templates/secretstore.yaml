# kind has no cloud secrets manager: ESO reads plain Secrets from the "data" namespace (dev only).
apiVersion: v1
kind: ServiceAccount
metadata: {name: eso-local, namespace: external-secrets}
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata: {name: platform-secrets}
spec:
  provider:
    kubernetes:
      remoteNamespace: data
      server: {caProvider: {type: ConfigMap, name: kube-root-ca.crt, namespace: external-secrets, key: ca.crt}}
      auth: {serviceAccount: {name: eso-local, namespace: external-secrets}}
