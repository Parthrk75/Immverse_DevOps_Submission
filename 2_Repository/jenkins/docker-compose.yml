# Local Jenkins + the same local registry used by scripts/local.sh (kind pulls from it).
#   docker compose -f jenkins/docker-compose.yml up --build -d   ->  http://localhost:8081
# Admin password: docker compose -f jenkins/docker-compose.yml exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
services:
  jenkins:
    build: {context: ., dockerfile: Dockerfile.controller}
    user: root                                   # needs the host docker socket (local demo only)
    ports: ["8081:8080"]
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment: {JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"}
  registry:
    image: registry:2
    container_name: kind-registry
    restart: always
    ports: ["127.0.0.1:5001:5000"]
volumes: {jenkins_home: {}}
